name: CI & Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://bajocero-omega.vercel.app' }}
  PUBLIC_OG_IMAGE: ${{ vars.PUBLIC_OG_IMAGE || 'https://bajocero-omega.vercel.app/assets/images/og-image.png' }}
  PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER || '+543586006854' }}
  PUBLIC_GOOGLE_SHEETS_URL: ${{ vars.PUBLIC_GOOGLE_SHEETS_URL }}
  PUBLIC_BUILD_ID: ${{ github.run_id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required env vars
        run: |
          test -n "$PUBLIC_GOOGLE_SHEETS_URL" || {
            echo "::error::PUBLIC_GOOGLE_SHEETS_URL no está definido. Configúralo como repository variable en Settings → Secrets and variables → Actions. Sin esta variable el catálogo desplegado usa el fallback hardcodeado."
            exit 1
          }

      - name: Type & syntax check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Dependency audit (prod)
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Verify production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}