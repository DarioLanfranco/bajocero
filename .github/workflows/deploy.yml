name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://dariolanfranco.github.io/bajocero' }}
  PUBLIC_OG_IMAGE: ${{ vars.PUBLIC_OG_IMAGE || 'https://dariolanfranco.github.io/bajocero/assets/images/og-image.png' }}
  PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER || '+543586006854' }}
  PUBLIC_GOOGLE_SHEETS_URL: ${{ vars.PUBLIC_GOOGLE_SHEETS_URL }}
  PUBLIC_BUILD_ID: ${{ github.run_id }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required env vars
        run: |
          test -n "$PUBLIC_GOOGLE_SHEETS_URL" || {
            echo "::error::PUBLIC_GOOGLE_SHEETS_URL no está definido. Configúralo como repository variable en Settings → Secrets and variables → Actions. Sin esta variable el catálogo desplegado usa el fallback hardcodeado."
            exit 1
          }

      - name: Type & syntax check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Dependency audit (prod)
        run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
